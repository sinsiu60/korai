<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>현태의 시골버스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@700;800&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js"}}</script>
<style>
/* a rural bus at dusk: county-bus green, LED amber, dashboard black */
:root{
  --ink:#0d1210; --panel:#131a17; --panel2:#1d2723; --line:#2c3a34; --green:#2fa86a; --green2:#1f7a4c; --amber:#ffb627; --red:#ff4b3a; --blue:#4fb3ff; --text:#eef6f1; --muted:#8ea89a;
  --f-shout:"Black Han Sans","Nanum Gothic",system-ui,sans-serif;
  --f-text:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-led:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--f-text);overflow:hidden;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.btn{font-family:var(--f-shout);font-size:18px;border:2px solid #0a3a24;border-radius:10px;padding:.45em 1.1em;min-height:44px;cursor:pointer;color:#05170e;background:var(--green);box-shadow:0 4px 0 #0a3a24;transition:filter .1s}
.btn:hover,.btn:focus-visible{filter:brightness(1.12);outline:none}
.btn.focus{outline:3px solid var(--amber);outline-offset:2px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0a3a24}
.btn.a{background:var(--amber);border-color:#5a3a00;box-shadow:0 4px 0 #8a5a00}
.btn.d{background:var(--panel2);color:var(--text);border-color:var(--line);box-shadow:0 4px 0 #050807}
.btn:disabled{opacity:.4;cursor:default}
[hidden]{display:none!important}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#route{position:absolute;left:16px;top:16px;background:#0d1210d9;border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-width:260px}
#route .no{display:inline-block;font-family:var(--f-shout);background:var(--green);color:#05170e;border-radius:6px;padding:0 8px;margin-right:6px}
#route .nx{font-family:var(--f-shout);font-size:22px;margin:4px 0 2px}
#route .meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
#route .late{color:var(--red)} #route .ok{color:var(--green)}
#mini{position:absolute;right:16px;top:16px;width:220px;height:220px;border-radius:12px;border:2px solid var(--line);background:#0d1210d9}
#dash{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#0a0e0ce6;border:2px solid var(--line);border-radius:16px;padding:8px 16px}
#gauge{width:150px;height:150px}
#dash .col{display:flex;flex-direction:column;gap:6px;align-items:center}
#gear{font-family:var(--f-led);font-size:34px;font-weight:700;color:var(--amber);min-width:56px;text-align:center;background:#000;border-radius:8px;padding:2px 8px}
#limit{width:52px;height:52px;border-radius:50%;border:6px solid var(--red);background:#fff;color:#000;font-family:var(--f-shout);font-size:20px;display:flex;align-items:center;justify-content:center}
.lamps{display:grid;grid-template-columns:repeat(5,34px);gap:5px}
.lamp{height:28px;border-radius:6px;background:#1a211e;color:#3a4a42;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:-.5px}
.lamp.on{color:#000}
.lamp.g.on{background:#3ad07a} .lamp.a.on{background:var(--amber)} .lamp.r.on{background:var(--red);color:#fff} .lamp.b.on{background:var(--blue)}
#pax{font-size:13px;color:var(--muted);text-align:center}
#banner{position:absolute;left:50%;top:15%;transform:translateX(-50%);background:#000c;border:2px solid var(--amber);color:var(--amber);font-family:var(--f-led);font-weight:700;padding:8px 18px;border-radius:8px;font-size:18px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toasts{position:absolute;right:16px;top:250px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:#0d1210e6;border-left:5px solid var(--amber);padding:6px 12px;border-radius:6px;font-weight:800;font-size:14px;animation:tin .2s ease-out}
.toast.bad{border-color:var(--red)} .toast.good{border-color:var(--green)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
#chat{position:absolute;left:16px;bottom:200px;width:330px;display:flex;flex-direction:column;gap:4px}
#chat p{margin:0;background:#0d1210c8;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;animation:tin .25s}
#chat b{color:var(--amber);margin-right:4px}
#hint{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--muted);background:#0d1210c8;border-radius:8px;padding:6px 10px;max-width:330px;line-height:1.6}
#hint kbd{font-family:var(--f-led);background:#2a3631;border-radius:4px;padding:0 4px;color:var(--text)}
#center{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--f-shout);font-size:40px;color:#fff;text-shadow:0 3px 0 #000,0 0 18px #000}
#rainfx{position:fixed;inset:0;pointer-events:none}
/* menus */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1d3a2c,#0b100e 70%);padding:20px;overflow:auto}
.screen.clear{background:#000a}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px 24px;width:min(920px,100%);max-height:100%;overflow:auto}
.card h1{font-family:var(--f-shout);font-weight:400;margin:0 0 4px;font-size:clamp(30px,5vw,54px);color:var(--amber)}
.card h2{font-family:var(--f-shout);font-weight:400;margin:0 0 12px;font-size:24px}
.card p{line-height:1.6}
.sub{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}
.tabs .btn{font-size:15px;min-height:38px;padding:.3em .9em}
.tabs .btn.on{background:var(--amber);border-color:#5a3a00;box-shadow:0 4px 0 #8a5a00;color:#2a1a00}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--panel2);border-radius:12px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-family:var(--f-shout);font-weight:400;font-size:24px}
.stat span{font-size:12.5px;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.item{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.item.sel{border-color:var(--amber)}
.item h3{margin:0;font-family:var(--f-shout);font-weight:400;font-size:20px}
.item .d{font-size:13px;color:var(--muted);line-height:1.5}
.item .btn{align-self:flex-start;font-size:15px;min-height:38px;padding:.3em .9em}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid #0008;cursor:pointer;padding:0}
.sw.on{border-color:#fff}
table.rep{width:100%;border-collapse:collapse;font-size:15px}
table.rep td{padding:7px 8px;border-bottom:1px solid var(--line)} table.rep td:last-child{text-align:right;font-weight:800}
.neg{color:var(--red)} .pos{color:var(--green)}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:14px}
.keys div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0}
.keys kbd{font-family:var(--f-led);background:#2a3631;border-radius:4px;padding:0 6px}
@media (max-width:700px){#chat,#hint{display:none} #mini{width:150px;height:150px} #route{min-width:0} #dash{transform:translateX(-50%) scale(.8);transform-origin:bottom center} .keys{grid-template-columns:1fr}}
@media (max-height:640px),(max-width:1000px){#dash{zoom:.72}#hint{display:none}#mini{zoom:.8}}
</style></head><body>
<canvas id="gl"></canvas>
<canvas id="rainfx"></canvas>
<div id="hud" hidden>
  <div id="route"><div><span class="no" id="rNo">1</span><span id="rName"></span></div><div class="nx" id="rNext"></div><div class="meta"><span id="rDist"></span><span id="rTime"></span><span id="rClock"></span></div></div>
  <canvas id="mini" width="440" height="440"></canvas>
  <div id="banner" hidden></div>
  <div id="center" hidden></div>
  <div id="toasts"></div>
  <div id="chat"></div>
  <div id="hint"></div>
  <div id="dash">
    <div class="col"><div id="limit">50</div><div id="gear">N</div></div>
    <canvas id="gauge" width="300" height="300"></canvas>
    <div class="col"><div class="lamps" id="lamps"></div><div id="pax"></div></div>
  </div>
</div>
<div id="menu" class="screen" hidden></div>

<script type="module">
/* ========= 현태의 시골버스 · 시우 공방 ========= */
import * as THREE from 'three';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const TEST = location.hash.includes('test');
const AA = (() => { try { return JSON.parse(decodeURIComponent(location.hash.split('aa=')[1] || '{}')); } catch (e) { return {}; } })();
const won = n => (n < 0 ? '-' : '') + '₩' + Math.abs(Math.round(n)).toLocaleString();
const fmtT = s => { const neg = s < 0; s = Math.abs(Math.round(s)); return (neg ? '-' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const rngOf = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// ---- audio: everything is synthesized ----
const audio = (() => {
  let ac = null, master, eng = null, rainG = null, muted = false;
  const init = () => {
    if (ac || TEST) return; try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ac.createGain(); master.gain.value = 0.6; master.connect(ac.destination);
    // engine: two detuned saws through a lowpass, plus a rumble
    const g = ac.createGain(); g.gain.value = 0; const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500; f.Q.value = 4;
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), o3 = ac.createOscillator(); o1.type = 'sawtooth'; o2.type = 'sawtooth'; o3.type = 'square';
    o1.connect(f); o2.connect(f); const g3 = ac.createGain(); g3.gain.value = 0.25; o3.connect(g3); g3.connect(f); f.connect(g); g.connect(master);
    o1.start(); o2.start(); o3.start(); eng = { g, f, o1, o2, o3 };
    // rain bed
    const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const ns = ac.createBufferSource(); ns.buffer = nb; ns.loop = true; const nf = ac.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 1200; rainG = ac.createGain(); rainG.gain.value = 0; ns.connect(nf); nf.connect(rainG); rainG.connect(master); ns.start();
  };
  const tone = (fr, dur, vol = 0.2, type = 'sine', delay = 0, slide = 0) => {
    if (!ac || muted) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(fr, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, fr + slide), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0008, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  };
  const noise = (dur, vol = 0.2, f0 = 2000, delay = 0, type = 'bandpass') => {
    if (!ac || muted) return; const t = ac.currentTime + delay, b = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = ac.createBufferSource(); s.buffer = b; const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = f0; const g = ac.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  };
  return {
    init, tone, noise,
    get ok() { return !!ac; },
    toggle() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.6; return muted; },
    engine(on, rpm, load, electric) {
      if (!eng) return; const t = ac.currentTime, base = electric ? rpm / 18 : rpm / 30;
      eng.o1.frequency.setTargetAtTime(base, t, 0.05); eng.o2.frequency.setTargetAtTime(base * 1.007 + 0.6, t, 0.05); eng.o3.frequency.setTargetAtTime(electric ? base * 4 : base / 2, t, 0.05);
      eng.f.frequency.setTargetAtTime(electric ? 900 + rpm / 3 : 260 + rpm * 0.35 + load * 500, t, 0.08);
      eng.g.gain.setTargetAtTime(on && !muted ? (electric ? 0.03 + load * 0.04 : 0.06 + load * 0.08) : 0, t, 0.12);
    },
    rain(v) { if (rainG) rainG.gain.setTargetAtTime(muted ? 0 : v * 0.05, ac.currentTime, 0.5); },
    door() { noise(0.5, 0.25, 900, 0, 'lowpass'); tone(160, 0.25, 0.06, 'square', 0.05, -60); },
    tick() { tone(1500, 0.03, 0.05, 'square'); },
    tock() { tone(1100, 0.03, 0.05, 'square'); },
    bell() { tone(1320, 0.5, 0.18, 'sine'); tone(1760, 0.6, 0.1, 'sine', 0.05); },
    chime() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.5, 0.1, 'triangle', i * 0.14)); },
    horn(on) { if (on) { tone(392, 0.35, 0.16, 'square'); tone(494, 0.35, 0.13, 'square'); } },
    crash() { noise(0.6, 0.6, 300, 0, 'lowpass'); tone(80, 0.4, 0.3, 'sawtooth', 0, -40); },
    start() { tone(60, 1.0, 0.2, 'sawtooth', 0, 50); noise(0.8, 0.15, 400, 0, 'lowpass'); },
    reverse() { tone(1000, 0.25, 0.08, 'square'); },
    select() { tone(660, 0.05, 0.08, 'triangle'); },
    coin() { tone(1400, 0.06, 0.08, 'square'); tone(1900, 0.1, 0.06, 'square', 0.06); },
    card() { tone(1800, 0.08, 0.07, 'sine'); },
    bad() { tone(220, 0.25, 0.1, 'square', 0, -60); },
    good() { tone(880, 0.1, 0.08, 'triangle'); tone(1320, 0.15, 0.08, 'triangle', 0.08); },
    xbell(i) { tone(i % 2 ? 900 : 760, 0.18, 0.08, 'square'); },
    train() { tone(330, 1.2, 0.12, 'sawtooth'); tone(415, 1.2, 0.1, 'sawtooth'); },
    kneel() { noise(0.7, 0.18, 600, 0, 'lowpass'); },
  };
})();
addEventListener('pointerdown', () => audio.init());
addEventListener('keydown', () => audio.init());

// ---- input: keyboard + gamepad, one state ----
const IN = { thr: 0, brk: 0, steer: 0, lookX: 0, lookY: 0, pressed: new Set(), pad: false, padName: '' };
const KEYS = new Set();
const KEYMAP = {
  // edge-triggered actions
  f: 'doorF', g: 'doorR', q: 'indL', e: 'indR', h: 'hazard', i: 'engine', l: 'lights', k: 'wiper', b: 'horn', c: 'cam', ' ': 'park', '1': 'gearD', '2': 'gearN', '3': 'gearR',
  m: 'mirror', tab: 'info', escape: 'pause', p: 'pause', enter: 'ok', n: 'kneel', j: 'mute', r: 'reset',
};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'tab'].includes(k)) e.preventDefault();
  if (!KEYS.has(k) && KEYMAP[k]) IN.pressed.add(KEYMAP[k]); KEYS.add(k);
});
addEventListener('keyup', e => KEYS.delete(e.key.toLowerCase()));
addEventListener('blur', () => KEYS.clear());
let kSteer = 0;
const PADMAP = { 0: 'doorF', 1: 'doorR', 2: 'park', 3: 'cam', 4: 'indL', 5: 'indR', 8: 'engine', 9: 'pause', 10: 'horn', 11: 'lights', 12: 'gearD', 13: 'gearR', 14: 'gearN', 15: 'hazard' };
const padPrev = {};
function pollInput(dt) {
  const up = KEYS.has('w') || KEYS.has('arrowup'), dn = KEYS.has('s') || KEYS.has('arrowdown');
  const lf = KEYS.has('a') || KEYS.has('arrowleft'), rt = KEYS.has('d') || KEYS.has('arrowright');
  // keyboard steering eases in and self-centres, like holding a real wheel
  const target = (rt ? 1 : 0) - (lf ? 1 : 0);
  if (target) kSteer = clamp(kSteer + target * dt * 1.6, -1, 1); else kSteer *= Math.max(0, 1 - dt * 3);
  let thr = up ? 1 : 0, brk = dn ? 1 : 0, steer = kSteer, lx = 0, ly = 0;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue; IN.pad = true; IN.padName = p.id;
    const dz = v => Math.abs(v) < 0.12 ? 0 : (v - Math.sign(v) * 0.12) / 0.88;
    const sx = dz(p.axes[0] || 0); if (sx) steer = Math.sign(sx) * Math.pow(Math.abs(sx), 1.6);
    lx = dz(p.axes[2] || 0); ly = dz(p.axes[3] || 0);
    const rtv = p.buttons[7] ? p.buttons[7].value : 0, ltv = p.buttons[6] ? p.buttons[6].value : 0;
    thr = Math.max(thr, rtv); brk = Math.max(brk, ltv);
    for (const [bi, act] of Object.entries(PADMAP)) { const b = p.buttons[bi], now = !!(b && b.pressed), key = p.index + ':' + bi; if (now && !padPrev[key]) IN.pressed.add(act); padPrev[key] = now; }
    break;
  }
  IN.thr = thr; IN.brk = brk; IN.steer = steer; IN.lookX = lx; IN.lookY = ly;
  if (window.__auto) { window.__auto(); IN.thr = window.__thr || 0; IN.brk = window.__brk || 0; IN.steer = window.__steer || 0; }
}
addEventListener('gamepadconnected', e => { IN.pad = true; IN.padName = e.gamepad.id; toast('🎮 게임패드 연결됨', 'good'); });
const took = a => { if (IN.pressed.has(a)) { IN.pressed.delete(a); return true; } return false; };

// ---- little DOM helpers ----
function toast(t, kind = '') { const box = $('#toasts'); if (!box) return; const d = document.createElement('div'); d.className = 'toast ' + kind; d.textContent = t; box.prepend(d); while (box.children.length > 5) box.lastChild.remove(); setTimeout(() => d.remove(), 3800); }
function chat(name, t) { const box = $('#chat'); const p = document.createElement('p'); const b = document.createElement('b'); b.textContent = name; p.appendChild(b); p.appendChild(document.createTextNode(t)); box.appendChild(p); while (box.children.length > 4) box.firstChild.remove(); setTimeout(() => p.remove(), 9000); }
let bannerT = 0; function banner(t, sec = 5) { const b = $('#banner'); b.textContent = t; b.hidden = false; bannerT = sec; }
let centerT = 0; function center(t, sec = 1.6, col = '#fff') { const c = $('#center'); c.textContent = t; c.style.color = col; c.hidden = false; centerT = sec; }

// ================= world: the county of 구불군 =================
const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.08, 3200);
const mirrorCam = new THREE.PerspectiveCamera(32, 1.2, 0.5, 400);
scene.fog = new THREE.Fog(0xbfd8e6, 120, 1500);
const hemi = new THREE.HemisphereLight(0xdff2ff, 0x5a7a3a, 0.85); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dc, 2.1); sun.position.set(120, 200, 80); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 10, far: 500 }); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
scene.add(sun); scene.add(sun.target);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); const rc = $('#rainfx'); rc.width = w; rc.height = h; }
addEventListener('resize', resize);

// ---- canvas textures ----
function canvasTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } return t;
}
function speckle(g, w, h, n, cols, sz = 2) { for (let i = 0; i < n; i++) { g.fillStyle = cols[i % cols.length]; g.fillRect(Math.random() * w, Math.random() * h, sz, sz); } }
const TEX = {

  MODE = 'menu'; $('#hud').hidden = true; window.__report = { net, stars: sc.stars, sc };
  show(`<div class="card" style="max-width:720px"><h2>${T.route.no}번 ${T.route.name} 운행 결과 <span style="color:var(--amber)">${'★'.repeat(sc.stars)}${'☆'.repeat(5 - sc.stars)}</span></h2>
    <div class="stats"><div class="stat"><b>${Math.round(sc.punct)}</b><span>정시성</span></div><div class="stat"><b>${Math.round(sc.safety)}</b><span>안전</span></div><div class="stat"><b>${Math.round(sc.service)}</b><span>서비스</span></div><div class="stat"><b>${Math.round(sc.comfort)}</b><span>승차감</span></div></div>
    <table class="rep">${row(`운임 수입 (${T.pcount}명${T.freeRides ? `, 닭 ${T.freeRides * 3}마리 무료` : ''})`, won(T.fares), 'pos')}${row('군 보조금 (정시성 반영)', won(subsidy), 'pos')}${bonus ? row('우수 운행 보너스', won(bonus), 'pos') : ''}${vip ? row(vip > 0 ? '군수님 만족' : '군수님 불만', won(vip), vip > 0 ? 'pos' : 'neg') : ''}${row(`연료비 (${km.toFixed(1)}km)`, won(-fuel), 'neg')}${repair ? row('수리비', won(-repair), 'neg') : ''}${fines ? row(`과태료·벌점 (${T.fines.length}건)`, won(-fines), 'neg') : ''}${row('<b>순이익</b>', won(net), net >= 0 ? 'pos' : 'neg')}</table>
    <p class="sub" style="margin-top:10px">평균 지연 ${fmtT(sc.avgLate)} · 지적 사항: ${issues}</p><div class="row"><button class="btn a" id="bHQ">차고로</button></div></div>`);
  $('#bHQ').onclick = hq; for (const c of CARS) scene.remove(c.mesh); CARS.length = 0;
}

// ---- actions while driving ----
function actions() {
  if (took('pause')) { if (PAUSED) { hideMenu(); PAUSED = false; } else pauseMenu(); return; }
  if (PAUSED) { menuPad(); return; }
  if (took('mute')) toast(audio.toggle() ? '소리 끔' : '소리 켬');
  if (took('engine')) { if (!BUS.engine) { BUS.engine = true; audio.start(); toast(BUS.spec.electric ? '전원 ON 🔋' : '부르릉… 시동 ON', 'good'); } else if (Math.abs(BUS.v) < 0.5) { BUS.engine = false; toast('시동 OFF'); } }
  if (took('gearD')) { if (Math.abs(BUS.v) < 1 || BUS.gear !== 'R') { BUS.gear = 'D'; BUS.g = 1; } else toast('멈춘 다음 바꾸씹시오'); }
  if (took('gearN')) BUS.gear = 'N';
  if (took('gearR')) { if (Math.abs(BUS.v) < 0.5) { BUS.gear = 'R'; audio.reverse(); } else toast('멈춘 다음 후진 기어'); }
  if (took('park')) { BUS.park = !BUS.park; audio.noise(0.25, 0.2, 700, 0, 'lowpass'); }
  if (took('doorF')) { if (Math.abs(BUS.v) < 0.6) { BUS.doorT.F = BUS.doorT.F ? 0 : 1; audio.door(); } else toast('달리는 중엔 문을 못 엽니다'); }
  if (took('doorR')) { if (!BUS.spec.doors.includes('R')) toast('이 버스는 앞문뿐이다'); else if (Math.abs(BUS.v) < 0.6) { BUS.doorT.R = BUS.doorT.R ? 0 : 1; audio.door(); } }
  if (took('indL')) { BUS.ind = BUS.ind === -1 ? 0 : -1; if (BUS.ind === -1) TRIP.indLeftT = TRIP.t; }
  if (took('indR')) BUS.ind = BUS.ind === 1 ? 0 : 1;
  if (took('hazard')) BUS.hazard = !BUS.hazard;
  if (took('lights')) BUS.lights = !BUS.lights;
  if (took('wiper')) BUS.wiper = !BUS.wiper;
  if (took('horn')) { audio.horn(true); for (const c of CARS) if (c.pos.distanceTo(BUS.pos) < 25) c.vmax = Math.min(c.vmax + 1, 18); }
  if (took('kneel')) { if (BUS.spec.kneel) { BUS.kneelOn = !BUS.kneelOn; audio.kneel(); } }
  if (took('cam')) { CAM.mode = (CAM.mode + 1) % 3; toast('카메라: ' + CAM_NAMES[CAM.mode]); }
  if (took('mirror')) { CAM.mirror = !CAM.mirror; }
  if (took('reset')) { if (Math.abs(BUS.v) < 1) { const P = RT.pts[RT.idx]; BUS.pos.copy(P.lane); BUS.yaw = Math.atan2(P.h.x, P.h.z); BUS.v = 0; fine('reset', 30000, '견인차 호출', 1); } }
  took('info'); took('ok');
  // a turn signal cancels itself after the turn, like the real one
  if (BUS.ind && Math.abs(BUS.steer) > 0.25) BUS.indArmed = true; if (BUS.indArmed && Math.abs(BUS.steer) < 0.05) { BUS.ind = 0; BUS.indArmed = false; }
}

// ---- main loop ----
let last = performance.now(), T = 0, FRAMES = 0;
const mirrorBox = document.createElement('div'); mirrorBox.style.cssText = 'position:fixed;border:3px solid #111;border-radius:10px;pointer-events:none;box-shadow:0 0 0 2px #2c3a34'; mirrorBox.hidden = true; document.body.appendChild(mirrorBox);
const mirrorLbl = document.createElement('div'); mirrorLbl.textContent = '우측 후방'; mirrorLbl.style.cssText = 'position:absolute;left:6px;top:4px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000'; mirrorBox.appendChild(mirrorLbl);
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * (AA.speed || 1); last = now; T += dt;
  pollInput(dt);
  if (MODE === 'drive') {
    actions();
    if (!PAUSED) { for (let i = 0; i < 2; i++) busStep(dt / 2); trafficTick(dt); tripTick(dt); }
    railTick(PAUSED ? 0 : dt, BUS.pos); busVisual(dt, T); camStep(dt); rainTick(dt); hudTick(T);
  } else { menuPad(); if (BUS.root) { railTick(dt, null); busVisual(dt, T); BUS.yaw += dt * 0.08; CAM.mode = 1; CAM.cpitch = 0.25; CAM.dist = 20; camStep(dt); } }
  if (bannerT > 0 && (bannerT -= dt) <= 0) $('#banner').hidden = true;
  if (centerT > 0 && (centerT -= dt) <= 0) $('#center').hidden = true;
  windshieldFX(dt);
  FRAMES = (FRAMES || 0) + 1; if (AA.norender && FRAMES % 30) { requestAnimationFrame(frame); return; }
  renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, camera);
  const showMirror = MODE === 'drive' && CAM.mirror && CAM.mode === 0;
  mirrorBox.hidden = !showMirror;
  if (showMirror) { const w = Math.min(280, innerWidth * 0.22), h = w * 0.62, x = innerWidth - w - 18, y = innerHeight * 0.42; mirrorCam.aspect = w / h; mirrorCam.updateProjectionMatrix(); renderer.setScissorTest(true); renderer.setScissor(x, y, w, h); renderer.setViewport(x, y, w, h); rainDrops.visible = false; renderer.render(scene, mirrorCam); rainDrops.visible = RAIN; renderer.setScissorTest(false); Object.assign(mirrorBox.style, { left: x + 'px', bottom: y + 'px', width: w + 'px', height: h + 'px' }); }
  requestAnimationFrame(frame);
}
// ---- boot ----
resize(); buildWorld(); makeBus('old'); placeBus(ROADS.loop, STOPS.term.d - 30); setNight(false);
Object.assign(TRIP, { route: ROUTES[0], onboard: [], fares: 0, t: 0, lim: 50 }); window.__ready = 1;
requestAnimationFrame(frame);
if (AA.go) { SAVE = freshSave(); drive(ROUTES.find(r => r.id === (AA.route || 1))); } else studio();
window.__api = { BUS, TRIP, RT, SV, IN, ROUTES, XRAIL, CARS, STOPS, ROADS, drive, hq, get SAVE() { return SAVE; }, set SAVE(v) { SAVE = v; }, freshSave, took, nextStop, camera, CAM };
</script>
</body></html>
