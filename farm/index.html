<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>현태의 시골 볶음밥 농장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@700;800&display=swap">
<style>
/* a spring field at dawn: warm soil, fresh green, egg-yolk yellow */
:root{
  --ink:#1b1410; --paper:#fff6e4; --paper2:#f3e3c3; --wood:#8a5a34; --wood2:#5a3a20; --leaf:#5fb04a; --yolk:#ffcc33; --red:#e8452f; --sky:#9fd8ff; --text:#2a1c10; --muted:#7a6248;
  --f-shout:"Black Han Sans","Nanum Gothic",system-ui,sans-serif;
  --f-text:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#20160e;color:var(--text);font-family:var(--f-text);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated}
.btn{font-family:var(--f-shout);font-size:clamp(14px,1.9vw,20px);border:3px solid var(--wood2);border-radius:12px;padding:.4em 1.1em;min-height:44px;cursor:pointer;color:var(--ink);background:var(--yolk);box-shadow:0 4px 0 #a67c10}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a67c10}
.btn.g{background:#a8e08a;box-shadow:0 4px 0 #4a8a30} .btn.d{background:var(--paper2);box-shadow:0 4px 0 #b49a6a}
.btn:disabled{opacity:.45;cursor:default}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding:0 4% 7%}
#ov[hidden],[hidden]{display:none!important}
/* dialogue */
#dlg{position:absolute;left:3%;right:3%;bottom:3.5%;min-height:22%;background:var(--paper);border:4px solid var(--wood2);border-radius:14px;box-shadow:0 6px 0 #0006;display:flex;gap:2%;padding:1.4% 2%;cursor:pointer}
#dlgFace{width:15%;aspect-ratio:1;flex:none;border-radius:10px;background:var(--paper2);border:3px solid var(--wood)}
#dlgBody{flex:1;min-width:0}
#dlgName{font-family:var(--f-shout);font-size:clamp(14px,2vw,22px);color:var(--red);margin-bottom:4px}
#dlgText{font-size:clamp(14px,2.1vw,22px);line-height:1.5;font-weight:800;white-space:pre-wrap}
#dlgArrow{position:absolute;right:2%;bottom:8%;font-size:clamp(12px,1.6vw,18px);color:var(--wood);animation:bob .8s infinite}
#dlgChoices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
@keyframes bob{50%{transform:translateY(4px)}}
/* panels: shop, inventory, summary */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,640px);max-height:88%;overflow:auto;background:var(--paper);border:4px solid var(--wood2);border-radius:16px;box-shadow:0 8px 0 #0007;padding:14px 16px}
.panel h2{font-family:var(--f-shout);font-weight:400;margin:0 0 10px;font-size:clamp(18px,2.6vw,26px);color:var(--wood2)}
.panel .row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:2px dashed #e0cba0}
.panel .row canvas{flex:none;width:40px;height:40px;background:var(--paper2);border-radius:8px}
.panel .row .nm{flex:1;font-weight:800;font-size:15px} .panel .row .nm small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.panel .row .btn{min-height:36px;padding:.2em .8em;font-size:15px}
.panel .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.slot{aspect-ratio:1;background:var(--paper2);border:3px solid #c9ad78;border-radius:8px;position:relative;cursor:pointer;padding:0}
.slot canvas{width:100%;height:100%;display:block}
.slot b{position:absolute;right:3px;bottom:1px;font-size:12px;color:var(--ink);text-shadow:0 0 3px #fff}
.slot.sel{border-color:var(--red)} .slot.hb{border-color:var(--wood)}
#invTip{min-height:40px;font-size:14px;font-weight:700;color:var(--muted);margin-top:8px}
/* touch controls */
#touch{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;left:3%;bottom:20%;width:17%;aspect-ratio:1;border-radius:50%;background:#fff3;border:3px solid #fff8;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;border-radius:50%;background:#fffc;transform:translate(-50%,-50%)}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid var(--wood2);font-family:var(--f-shout);font-size:clamp(13px,1.8vw,19px);color:var(--ink);display:flex;align-items:center;justify-content:center;touch-action:none}
#bUse{right:4%;bottom:24%;width:11%;aspect-ratio:1;background:var(--yolk)}
#bTalk{right:16%;bottom:16%;width:8%;aspect-ratio:1;background:#a8e08a}
#bBag{right:3%;top:27%;width:6.5%;aspect-ratio:1;background:var(--paper2);font-size:clamp(11px,1.4vw,15px)}
#toast{position:absolute;left:50%;top:15%;transform:translateX(-50%);background:#2a1c10d8;color:#fff6e4;font-weight:800;padding:8px 16px;border-radius:999px;font-size:clamp(13px,1.7vw,18px);white-space:nowrap;pointer-events:none}
#rotate{position:fixed;inset:0;background:#20160e;color:#fff6e4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;text-align:center;padding:20px;font-weight:800}
#rotate b{font-family:var(--f-shout);font-weight:400;font-size:26px}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}
</style></head><body>
<div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="touch" hidden><div id="joy"><div id="knob"></div></div><div class="tbtn" id="bUse">사용</div><div class="tbtn" id="bTalk">대화</div><div class="tbtn" id="bBag">가방</div></div>
  <div id="toast" hidden></div>
  <div id="dlg" hidden><canvas id="dlgFace" width="160" height="160"></canvas><div id="dlgBody"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgChoices"></div></div><div id="dlgArrow">▼</div></div>
  <div id="shop" class="panel" hidden><h2>씨앗 자판기 「심어라 2인분」</h2><div id="shopList"></div><div class="foot"><span id="shopMoney"></span><button class="btn d" id="shopClose" type="button">닫기</button></div></div>
  <div id="inv" class="panel" hidden><h2>가방</h2><div class="grid" id="invGrid"></div><div id="invTip">칸을 하나 누르고, 바꿀 칸을 누르면 자리가 바뀐다. 윗줄 10칸이 단축바.</div><div class="foot"><span id="invMoney"></span><button class="btn d" id="invClose" type="button">닫기</button></div></div>
  <div id="sum" class="panel" hidden><h2 id="sumTitle"></h2><div id="sumList"></div><div class="foot"><span id="sumTotal"></span><button class="btn" id="sumOk" type="button">다음 날 ▶</button></div></div>
  <div id="ov" hidden></div>
</div>
<div id="rotate"><div style="font-size:48px">📱↻</div><b>휴대폰을 가로로 돌려 주세요</b><span>농장은 가로 화면에서 플레이합니다</span></div>

<script>
'use strict';
/* ========= 역전현태 · 시우 공방 — core: canvas, clock, audio, input ========= */
const W = 960, H = 540, PI = Math.PI, TAU = PI * 2;
const $ = s => document.querySelector(s);
const cv = $('#cv'); let ctx = cv.getContext('2d');
const TEST = location.hash.includes('test');
let SPEED = 1, T = 0, RT = 0, last = performance.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, rnd = (a, b) => a + Math.random() * (b - a);
const ezo = k => 1 - Math.pow(1 - k, 3), ezio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function fitCanvas() {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const s = Math.min(2.5, Math.max(1, (window.devicePixelRatio || 1) * r.width / W));
  const w = Math.round(W * s), h = Math.round(H * s); if (cv.width !== w) { cv.width = w; cv.height = h; }
}
addEventListener('resize', fitCanvas);
// ---- game clock: every wait runs on game time so tests can fast-forward ----
const timers = [];
const wait = s => new Promise(r => timers.push({ at: T + s, r }));
const until = f => new Promise(r => timers.push({ f, r }));
function tick(dt) { for (let i = timers.length - 1; i >= 0; i--) { const t = timers[i]; if (t.f ? t.f() : T >= t.at) { timers.splice(i, 1); t.r(); } } }
async function tween(d, f, ez = ezio) { const t0 = T; while (T - t0 < d) { f(ez(clamp((T - t0) / d, 0, 1))); await wait(0); } f(1); }
// ---- images ----
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
const IMG = {};
// ---- audio: a tiny chiptune synth ----
const audio = (() => {
  let ac = null, master = null, mus = null, musGain = null, muted = false, cur = null, seqT = 0, seqStep = 0, seqTimer = 0;
  function init() { if (ac) return; try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination); musGain = ac.createGain(); musGain.gain.value = 0.32; musGain.connect(master); } catch (e) { ac = null; } }
  function tone(f, d, v = 0.15, type = 'square', when = 0, slide = 0, dest) {
    if (!ac || muted || TEST) return; const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + 0.02);
  }
  function noise(d, v = 0.2, freq = 1200, when = 0, q = 0.8, sweep = 0) {
    if (!ac || muted || TEST) return; const t = ac.currentTime + when, n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); if (sweep) f.frequency.exponentialRampToValueAtTime(freq * sweep, t + d); f.Q.value = q; g.gain.value = v;
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  // ---- music: note strings "A4:2 r:1 C5:1" — durations in 8ths ----
  const NOTE = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
  const hz = n => { const m = n.match(/^([A-G])(#|b)?(\d)$/); if (!m) return 0; const s = NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] - 4) * 12; return 440 * Math.pow(2, s / 12); };
  function parse(str) { const out = []; let t = 0; for (const tok of str.trim().split(/\s+/)) { const [n, d] = tok.split(':'); const dd = +(d || 1); out.push({ t, f: n === 'r' ? 0 : hz(n), d: dd }); t += dd; } return { notes: out, len: t }; }
  const SONGS = {};
  function song(name, bpm, parts) { SONGS[name] = { bpm, parts: parts.map(p => Object.assign(parse(p.n), p)) }; }
  // all tunes below are original
  song('spring', 104, [
    { n: 'C5:2 E5:2 G5:2 E5:2 D5:2 C5:2 A4:4 G4:2 A4:2 C5:2 D5:2 E5:6 r:2 E5:2 G5:2 A5:2 G5:2 E5:2 D5:2 C5:4 D5:2 E5:2 D5:2 A4:2 C5:6 r:2', w: 'triangle', v: 0.15 },
    { n: 'C3:4 G3:4 A2:4 E3:4 F2:4 C3:4 G2:4 G2:4 C3:4 G3:4 A2:4 E3:4 F2:4 G2:4 C3:8', w: 'triangle', v: 0.13 },
    { n: 'r:2 G5:1 r:3 E5:1 r:1 r:2 A5:1 r:3 G5:1 r:1', w: 'square', v: 0.025 }]);
  song('rain', 84, [
    { n: 'A4:4 C5:2 E5:2 D5:4 C5:2 A4:2 G4:4 A4:2 C5:2 A4:8 F4:4 A4:2 C5:2 B4:4 G4:2 E4:2 A4:12 r:4', w: 'triangle', v: 0.13 },
    { n: 'A2:8 F2:8 C3:8 E2:8', w: 'triangle', v: 0.12 }]);
  song('night', 72, [
    { n: 'E5:4 D5:2 C5:2 G4:8 A4:4 C5:2 D5:2 E5:8 D5:4 C5:2 A4:2 G4:4 E4:4 G4:12 r:4', w: 'sine', v: 0.14 },
    { n: 'C3:8 A2:8 F2:8 G2:8', w: 'triangle', v: 0.1 }]);
  song('lobby', 96, [
    { n: 'E4:2 G4:2 A4:2 G4:1 E4:1 D4:2 C4:2 D4:2 E4:2 | G4:2 C5:2 B4:2 A4:1 G4:1 E4:4 r:4'.replace(/\|/g, ''), w: 'triangle', v: 0.18 },
    { n: 'C3:4 G3:4 A2:4 E3:4 F2:4 C3:4 G2:4 G2:4', w: 'triangle', v: 0.16 },
    { n: 'r:2 E5:1 r:5 r:2 C5:1 r:5 r:2 A4:1 r:5 r:2 B4:1 r:5', w: 'square', v: 0.035 }]);
  song('trial', 112, [
    { n: 'A4:2 A4:1 C5:1 E5:3 D5:1 C5:2 B4:2 G4:4 A4:2 C5:2 E5:2 A5:2 G5:3 E5:1 D5:2 E5:6', w: 'square', v: 0.07 },
    { n: 'A2:2 A3:2 A2:2 A3:2 F2:2 F3:2 G2:2 G3:2 A2:2 A3:2 F2:2 F3:2 G2:2 G3:2 E2:2 E3:2', w: 'triangle', v: 0.2 },
    { n: 'r:1 E4:1 r:1 E4:1 r:1 C4:1 r:1 C4:1 r:1 D4:1 r:1 D4:1 r:1 B3:1 r:1 B3:1', w: 'square', v: 0.03 }]);
  song('cross', 124, [
    { n: 'A2:1 A2:1 A3:1 A2:1 G2:1 G2:1 G3:1 G2:1 F2:1 F2:1 F3:1 F2:1 E2:1 E2:1 G#2:1 B2:1', w: 'triangle', v: 0.22 },
    { n: 'r:4 E5:1 D5:1 C5:1 B4:1 r:4 C5:1 B4:1 A4:1 G#4:1 r:4 A4:1 B4:1 C5:1 D5:1 E5:3 r:1 B4:4', w: 'square', v: 0.06 },
    { n: 'C4:1 r:1 C4:1 r:1 B3:1 r:1 B3:1 r:1 A3:1 r:1 A3:1 r:1 G#3:1 r:1 G#3:1 r:1', w: 'square', v: 0.025 }]);
  song('pursuit', 158, [
    { n: 'D3:1 D3:1 D4:1 D3:1 D3:1 D4:1 D3:1 C4:1 Bb2:1 Bb2:1 Bb3:1 Bb2:1 C3:1 C3:1 C4:1 E3:1', w: 'triangle', v: 0.24 },
    { n: 'A4:2 D5:2 F5:2 E5:1 D5:1 C5:2 D5:2 A4:4 Bb4:2 D5:2 G5:2 F5:1 E5:1 F5:2 E5:2 C5:4', w: 'square', v: 0.075 },
    { n: 'F4:1 A4:1 F4:1 A4:1 F4:1 A4:1 F4:1 A4:1 F4:1 Bb4:1 F4:1 Bb4:1 G4:1 C5:1 G4:1 C5:1', w: 'square', v: 0.025 }]);
  song('win', 132, [
    { n: 'C5:1 E5:1 G5:1 C6:3 r:1 A5:1 G5:2 E5:2 F5:2 A5:2 G5:4 E5:1 G5:1 C6:6', w: 'square', v: 0.08 },
    { n: 'C3:2 G3:2 C3:2 G3:2 F2:2 C3:2 G2:2 D3:2 C3:2 G3:2 F2:2 G2:2 C3:4 C3:4', w: 'triangle', v: 0.2 }]);
  song('sad', 72, [
    { n: 'E4:3 D4:1 C4:2 B3:2 A3:4 r:2 C4:2 B3:3 A3:1 G#3:2 B3:2 A3:6 r:2', w: 'triangle', v: 0.18 },
    { n: 'A2:4 E3:4 F2:4 C3:4 D3:4 A2:4 E2:4 E2:4', w: 'triangle', v: 0.12 }]);
  song('tension', 80, [
    { n: 'A2:8 Bb2:8 A2:8 G#2:8', w: 'triangle', v: 0.16 },
    { n: 'r:6 E5:1 r:1 r:8 r:6 F5:1 r:1 r:8', w: 'square', v: 0.025 }]);
  song('dark', 70, [
    { n: 'D2:8 Eb2:8 D2:8 C#2:8', w: 'triangle', v: 0.18 },
    { n: 'r:4 A4:1 r:3 r:2 Bb4:1 r:5 r:4 A4:1 r:1 G#4:1 r:1 r:8', w: 'square', v: 0.03 },
    { n: 'r:7 D6:1 r:8 r:6 Eb6:1 r:9 r:8', w: 'sine', v: 0.04 }]);
  song('debate', 138, [
    { n: 'E2:1 E3:1 E2:1 E3:1 F2:1 F3:1 F2:1 F3:1 E2:1 E3:1 E2:1 E3:1 D2:1 D3:1 D#2:1 D#3:1', w: 'triangle', v: 0.22 },
    { n: 'B4:2 C5:1 B4:1 A4:2 G#4:2 B4:2 E5:2 D#5:4 B4:2 C5:1 D5:1 E5:2 F5:2 E5:3 D#5:1 B4:4', w: 'square', v: 0.065 },
    { n: 'r:1 G#3:1 r:1 G#3:1 r:1 A3:1 r:1 A3:1 r:1 G#3:1 r:1 G#3:1 r:1 F#3:1 r:1 F#3:1', w: 'square', v: 0.025 }]);
  song('exec', 96, [
    { n: 'A2:2 E3:1 E3:1 G#2:2 E3:1 E3:1 G2:2 E3:1 E3:1 F#2:2 D#3:1 D#3:1', w: 'triangle', v: 0.2 },
    { n: 'A4:3 C5:1 E5:2 D#5:3 F5:1 E5:2 C5:3 B4:1 A4:2 G#4:6', w: 'square', v: 0.06 }]);
  function sched() {
    if (!ac || !cur) return; const S = SONGS[cur], st = 60 / S.bpm / 2;
    while (seqT < ac.currentTime + 0.25) {
      for (const p of S.parts) { const k = seqStep % p.len; for (const n of p.notes) if (n.t === k && n.f) tone(n.f, n.d * st * 0.92, p.v, p.w, seqT - ac.currentTime, 0, musGain); }

  }
  return {
    init, tone, noise, get muted() { return muted; },
    toggle() { muted = !muted; if (musGain) musGain.gain.value = muted ? 0 : 0.32; return muted; },
    music(name) { init(); if (cur === name) return; cur = name || null; if (!ac) return; seqT = ac.currentTime + 0.05; seqStep = 0; clearInterval(seqTimer); if (cur) seqTimer = setInterval(sched, 60); },
    get song() { return cur; },
    blip(f) { tone(f, 0.035, 0.05, 'square'); },
    gavel() { tone(140, 0.12, 0.4, 'triangle', 0, 0.5); noise(0.08, 0.5, 900); },
    slam() { noise(0.2, 0.7, 300, 0, 0.6); tone(70, 0.25, 0.4, 'sine', 0, 0.5); },
    shout() { noise(0.25, 0.4, 2500, 0, 0.5, 0.4); tone(392, 0.12, 0.12, 'sawtooth'); tone(523, 0.12, 0.12, 'sawtooth', 0.06); tone(784, 0.5, 0.14, 'sawtooth', 0.12, 0.98); },
    damage() { noise(0.35, 0.6, 400, 0, 0.6, 0.3); tone(110, 0.4, 0.3, 'sawtooth', 0, 0.4); },
    whoosh() { noise(0.22, 0.25, 600, 0, 0.7, 4); },
    item() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 0.1, 'square', i * 0.07)); },
    bad() { tone(220, 0.25, 0.2, 'sawtooth', 0, 0.6); tone(165, 0.4, 0.2, 'sawtooth', 0.2, 0.6); },
    sizzle(d = 1) { noise(d, 0.15, 5000, 0, 0.4); },
    splash() { noise(0.6, 0.6, 700, 0, 0.5, 0.3); tone(90, 0.5, 0.3, 'sine', 0, 0.5); },
    crowd() { for (let i = 0; i < 6; i++) noise(0.4, 0.08, rnd(300, 900), i * 0.12, 2); },
    boom() { noise(0.9, 0.8, 200, 0, 0.5, 0.25); tone(55, 0.9, 0.5, 'sine', 0, 0.5); },
    select() { tone(880, 0.05, 0.06, 'square'); },
  };
})();
// ---- input: one "advance" signal shared by taps, clicks and keys ----
let advWaiters = [];
const advance = () => new Promise(r => advWaiters.push(r));
function fireAdvance() { const w = advWaiters; advWaiters = []; w.forEach(r => r()); }
const keyHandlers = {};
addEventListener('keydown', e => { if (e.repeat) return; const h = keyHandlers[e.key.toLowerCase()] || keyHandlers[e.key]; if (h) { e.preventDefault(); h(); } });

const XCHAR = {};

const SEASONS = ['봄', '여름', '가을', '겨울'], WEEK = ['월', '화', '수', '목', '금', '토', '일'];

// ---- world state ----

  for (let y = 13; y < 31; y++) for (let x = 10; x < 40; x++) {

    const r = R(); if (r < 0.15) setFree(x, y, { t: 'weed' }); else if (r < 0.21) setFree(x, y, { t: 'rock', hp: 2 }); else if (r < 0.245) setFree(x, y, { t: 'stump', hp: 3 }); else if (r < 0.26) setFree(x, y, { t: 'branch' });

const SAVEKEY = 'hy-farm-v1';

}

// ---- player ----

}

// ---- actions ----

let MENU = null;
const dlg = $('#dlg'), dlgFace = $('#dlgFace'), fctx = dlgFace.getContext('2d');

// shop
const shopEl = $('#shop');

// ---- time and days ----
const clockStr = m => { const h = Math.floor(m / 60) % 24, mm = m % 60; return `${h < 12 ? '오전' : '오후'} ${((h + 11) % 12) + 1}:${String(mm).padStart(2, '0')}`; };
let tickAcc = 0;

    if (G.time === 1440) toast('자정입니다. 슬슬 자야 합니다. 예.');

async function endDay(passedOut) {

  let pen = 0; if (passedOut) { pen = Math.min(1000, Math.floor(G.money * 0.1)); G.money -= pen; }
  G.money += total; G.stats.earned += total; G.shipped = [];
