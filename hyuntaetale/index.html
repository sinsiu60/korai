<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>현태테일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#fff;--org:#ff7f27;--yel:#ffff00}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000}}
:root[data-theme="dark"]{--bg:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Noto Sans KR',sans-serif}
#wrap{position:relative;flex:0 0 auto}
canvas#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#pad{display:none;width:100%;max-width:640px;flex:0 0 auto;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center}
body.touch #pad{display:flex}
.dp{position:relative;width:150px;height:150px}
.dp b,.ab b{position:absolute;display:flex;align-items:center;justify-content:center;background:#000;border:4px solid #fff;color:#fff;font:900 18px 'Noto Sans KR',sans-serif;image-rendering:pixelated}
.dp b{width:50px;height:50px}
.dp b.on,.ab b.on{background:#ff7f27;border-color:#ffff00;color:#000}
.dp .u{left:50px;top:0}.dp .d{left:50px;top:100px}.dp .l{left:0;top:50px}.dp .r{left:100px;top:50px}
.ab{position:relative;width:150px;height:150px}
.ab .z{width:70px;height:70px;right:0;top:20px;border-color:#ff7f27;color:#ff7f27}
.ab .x{width:56px;height:56px;left:6px;top:80px}
#mute{position:absolute;right:6px;top:6px;z-index:2;background:#000;border:3px solid #fff;color:#fff;font:900 12px 'Noto Sans KR',sans-serif;padding:3px 7px;cursor:pointer;opacity:.75}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="640" height="480"></canvas><button id="mute" type="button">소리 ON</button></div>
<div id="pad">
  <div class="dp"><b class="u" data-k="up">▲</b><b class="l" data-k="left">◀</b><b class="r" data-k="right">▶</b><b class="d" data-k="down">▼</b></div>
  <div class="ab"><b class="z" data-k="z">예.</b><b class="x" data-k="x">X</b></div>
</div>
<script>
'use strict';
/* ========= 현태테일 — core: canvas, input, audio, pixel text, sprites, scheduler ========= */
const LW = 640, LH = 480;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let K = 2, SPEED = 1;
const PI = Math.PI, TAU = PI * 2;
const rand = Math.random, clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[(rand() * a.length) | 0], rr = (a, b) => a + rand() * (b - a);
const ezo = t => 1 - (1 - t) * (1 - t), ezio = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');

function fit() {
  const pad = document.getElementById('pad');
  const ph = isTouch ? pad.offsetHeight || 180 : 0;
  const aw = window.innerWidth, ah = window.innerHeight - ph;
  let s = Math.min(aw / LW, ah / LH);
  if (s >= 1) s = Math.floor(s * 2) / 2;
  const cw = Math.round(LW * s), ch = Math.round(LH * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const dpr = window.devicePixelRatio || 1;
  K = clamp(Math.ceil(s * dpr), 1, 4);
  cv.width = LW * K; cv.height = LH * K;
}
window.addEventListener('resize', fit); fit();

/* ---------- input ---------- */
const keys = {}, hit = {};
const KMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', KeyZ: 'z', Enter: 'z', Space: 'z', KeyX: 'x', ShiftLeft: 'x', ShiftRight: 'x', KeyC: 'c', KeyM: 'm' };
function press(k) { if (!keys[k]) hit[k] = true; keys[k] = true; audio.unlock(); }
function release(k) { keys[k] = false; }
addEventListener('keydown', e => { const k = KMAP[e.code]; if (!k) return; e.preventDefault(); if (e.repeat) return; press(k); if (k === 'm') audio.toggle(); });
addEventListener('keyup', e => { const k = KMAP[e.code]; if (k) release(k); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#pad b').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.classList.add('on'); press(k); };
  const off = e => { e.preventDefault(); b.classList.remove('on'); release(k); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
cv.addEventListener('pointerdown', () => { audio.unlock(); if (!isTouch) press('z'), setTimeout(() => release('z'), 60); });
const took = k => { if (hit[k]) { hit[k] = false; return true; } return false; };
const anyHit = () => took('z');
document.getElementById('mute').onclick = e => { e.stopPropagation(); audio.unlock(); audio.toggle(); };

/* ---------- audio ---------- */
const audio = (() => {
  let ac = null, master = null, mus = null, on = true, loop = null;
  const A = {
    unlock() { if (ac) { if (ac.state === 'suspended') ac.resume(); return; } try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination); mus = ac.createGain(); mus.gain.value = 0.32; mus.connect(master); } catch (e) { ac = null; } },
    toggle() { on = !on; if (master) master.gain.value = on ? 0.5 : 0; document.getElementById('mute').textContent = on ? '소리 ON' : '소리 OFF'; },
    tone(f, d, v = 0.15, type = 'square', when = 0, slide = 0, dest) {
      if (!ac) return; const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
      o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + 0.02);
    },
    noise(d, v = 0.2, hp = 800, when = 0, dest) {
      if (!ac) return; const t = ac.currentTime + when, n = Math.max(1, (ac.sampleRate * d) | 0), b = ac.createBuffer(1, n, ac.sampleRate), ch = b.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = ac.createBufferSource(); s.buffer = b; const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; const g = ac.createGain(); g.gain.value = v;
      s.connect(f); f.connect(g); g.connect(dest || master); s.start(t);
    },
    blip(voice) { if (voice === 'hy') A.tone(150 + Math.random() * 20, 0.06, 0.12, 'square'); else if (voice === 'sys') A.tone(520, 0.035, 0.05, 'square'); },
    move() { A.tone(880, 0.04, 0.07, 'square'); },
    sel() { A.tone(660, 0.05, 0.1, 'square'); A.tone(990, 0.08, 0.1, 'square', 0.05); },
    hurt() { A.noise(0.08, 0.22, 400); A.tone(140, 0.08, 0.12, 'square', 0, 0.5); },
    heal() { [523, 659, 784, 1046].forEach((f, i) => A.tone(f, 0.12, 0.1, 'square', i * 0.06)); },
    slam() { A.tone(90, 0.25, 0.4, 'triangle', 0, 0.4); A.noise(0.18, 0.3, 120); },
    charge() { A.tone(200, 0.45, 0.12, 'sawtooth', 0, 4); },
    beam() { A.noise(0.45, 0.35, 300); A.tone(70, 0.4, 0.25, 'square', 0, 0.6); },
    crack() { A.noise(0.06, 0.3, 2000); A.tone(1200, 0.05, 0.08, 'square', 0, 0.4); },
    spawn() { A.tone(1400, 0.03, 0.04, 'square', 0, 0.6); },
    ding() { A.tone(1318, 0.18, 0.12, 'square'); },
    slash() { A.noise(0.2, 0.3, 1500); A.tone(900, 0.2, 0.1, 'sawtooth', 0, 0.2); },
    big() { A.tone(60, 0.8, 0.45, 'square', 0, 0.5); A.noise(0.6, 0.4, 100); },
    shatter() { A.noise(0.3, 0.35, 1000); [880, 660, 440].forEach((f, i) => A.tone(f, 0.1, 0.12, 'square', i * 0.07)); },
    // ---- music: original chiptune loop (not from any existing song) ----
    music(mode) {
      if (!ac) return; A.stopMusic(); if (!mode) return;
      const fast = mode === 2, bpm = fast ? 168 : 148, e8 = 60 / bpm / 2;
      const prog = [[50, 57], [46, 53], [41, 48], [48, 55], [50, 57], [46, 53], [43, 50], [45, 52]];
      const lead = [[69, 0, 74, 0, 72, 69, 0, 65], [65, 67, 69, 0, 70, 0, 69, 67], [69, 0, 72, 0, 77, 0, 76, 74], [72, 0, 67, 0, 64, 0, 67, 0],
        [74, 0, 77, 0, 76, 74, 72, 69], [70, 0, 74, 0, 77, 0, 74, 70], [67, 70, 74, 0, 72, 70, 69, 67], [64, 0, 69, 0, 73, 0, 76, 0]];
      const f = m => 440 * Math.pow(2, (m - 69) / 12);
      let step = 0, next = ac.currentTime + 0.08;
      const tick = () => {
        while (next < ac.currentTime + 0.25) {
          const bar = (step >> 3) % 8, s = step & 7, [r, fi] = prog[bar], w = next - ac.currentTime;
          const bn = [r, r, r + 12, r, fi, r, r + 12, fi][s];
          A.tone(f(bn - 12), e8 * 0.9, 0.22, 'triangle', w, 0, mus);
          const ln = lead[bar][s]; if (ln && (step >> 6) % 2 === 0 || ln && fast) A.tone(f(ln + (fast && (step >> 6) % 2 ? 12 : 0)), e8 * 0.85, 0.07, 'square', w, 0, mus);
          if ((step >> 6) % 2 === 1 && !fast) { const ar = [r + 24, r + 31, r + 36, r + 31][s & 3]; A.tone(f(ar), e8 * 0.5, 0.035, 'square', w, 0, mus); }
          if (fast) { if (s % 2 === 1) A.noise(0.03, 0.06, 6000, w, mus); if (s === 0 || s === 4) A.tone(110, 0.12, 0.35, 'sine', w, 0.4, mus); if (s === 2 || s === 6) A.noise(0.1, 0.12, 1500, w, mus); }
          else if (s === 0 || s === 4) A.tone(100, 0.1, 0.25, 'sine', w, 0.45, mus);
          step++; next += e8;
        }
      };
      tick(); loop = setInterval(tick, 50);
    },
    stopMusic() { if (loop) clearInterval(loop); loop = null; },
  };
  return A;
})();

/* ---------- pixel text (thresholded → crisp pixels) ---------- */
const FONT = "'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
const tcache = new Map();
const mctx = document.createElement('canvas').getContext('2d');
function tbmp(str, size = 17, color = '#ffffff', weight = 700) {
  if (color.length === 4) color = '#' + color[1] + color[1] + color[2] + color[2] + color[3] + color[3];
  const key = str + '|' + size + '|' + color + '|' + weight;
  let b = tcache.get(key); if (b) return b;
  mctx.font = `${weight} ${size}px ${FONT}`;
  const w = Math.ceil(mctx.measureText(str).width) + 4, h = Math.ceil(size * 1.45) + 2;
  const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = h;
  const g = c.getContext('2d'); g.font = mctx.font; g.textBaseline = 'middle'; g.fillStyle = '#fff'; g.fillText(str, 1, h / 2);
  const id = g.getImageData(0, 0, c.width, h), d = id.data;
  const r = parseInt(color.slice(1, 3), 16), gg = parseInt(color.slice(3, 5), 16), bb = parseInt(color.slice(5, 7), 16);
  for (let i = 0; i < d.length; i += 4) { const on = d[i + 3] > 105; d[i] = r; d[i + 1] = gg; d[i + 2] = bb; d[i + 3] = on ? 255 : 0; }
  g.putImageData(id, 0, 0);
  // prefix widths for typewriter reveal
  const pw = [0]; for (let i = 1; i <= str.length; i++) pw.push(Math.ceil(mctx.measureText(str.slice(0, i)).width) + 1);
  b = { c, w: w - 4, h, pw }; tcache.set(key, b); return b;
}
// draw text; n = characters revealed (Infinity = all); px = pixel scale; align 'l'|'c'|'r'
function text(str, x, y, o = {}) {
  const b = tbmp(str, o.size || 17, o.color || '#ffffff', o.weight || 700), px = o.px || 1;
  const n = o.n === undefined ? Infinity : o.n, rw = n >= str.length ? b.c.width : b.pw[Math.max(0, n)];
  let dx = x; if (o.align === 'c') dx = x - b.w * px / 2; else if (o.align === 'r') dx = x - b.w * px;
  if (rw <= 0) return b.w * px;
  ctx.drawImage(b.c, 0, 0, rw, b.h, Math.round(dx), Math.round(y - b.h * px / 2), rw * px, b.h * px);
  return b.w * px;
}
function wrap(str, maxW, size = 17, weight = 700) {
  mctx.font = `${weight} ${size}px ${FONT}`; const out = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (mctx.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
    }
    out.push(line);
  }
  return out;
}

/* ---------- pixel sprites from strings ---------- */
function spr(rows, pal, s = 1) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w * s; c.height = h * s; const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { const col = pal[ch]; if (col) { g.fillStyle = col; g.fillRect(x * s, y * s, s, s); } }));
  return c;
}
function drawSpr(c, x, y, o = {}) {
  const sc = o.sc || 1;
  if (o.rot) { ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(o.rot); if (o.flip) ctx.scale(-1, 1); ctx.drawImage(c, -c.width * sc / 2, -c.height * sc / 2, c.width * sc, c.height * sc); ctx.restore(); return; }
  if (o.flip) { ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.scale(-1, 1); ctx.drawImage(c, -c.width * sc / 2, -c.height * sc / 2, c.width * sc, c.height * sc); ctx.restore(); return; }
  ctx.drawImage(c, Math.round(x - c.width * sc / 2), Math.round(y - c.height * sc / 2), c.width * sc, c.height * sc);
}
const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

const HEART = ['.##...##.', '####.####', '#########', '#########', '.#######.', '..#####..', '...###...', '....#....'];
const SPR = {
  heart: spr(HEART, { '#': '#ff0000' }, 2),
  heartB: spr(HEART, { '#': '#0a3cff' }, 2),
  heartL: spr(HEART.map(r => r.slice(0, 5)), { '#': '#ff0000' }, 2),
  heartR: spr(HEART.map(r => '....' + r.slice(4)), { '#': '#ff0000' }, 2),
  heartBroken: spr(['.##...##.', '####.####', '####..###', '###.#####', '.###.###.', '..##.##..', '...#.#...', '....#....'], { '#': '#ff0000' }, 2),
  shard: spr(['#.', '##', '.#'], { '#': '#ff0000' }, 2),
  grain: spr(['.ww.', 'wwww', '.wg.'], { w: '#ffffff', g: '#d8d8c8' }, 2),
  clump: spr(['..wyw..', '.wwgwy.', 'ywwwwwg', 'wgywwyw', '.wwyww.'], { w: '#fff8e0', y: '#ffd21a', g: '#4cc04c' }, 2),
  egg: spr(['..ww..', '.wwww.', 'wwwwww', 'wwwwgw', 'wwwwgw', '.wwgg.', '..gg..'], { w: '#ffffff', g: '#c8c8c8' }, 2),
  yolk: spr(['.yy.', 'yYYy', 'yYYy', '.yy.'], { y: '#ffb000', Y: '#ffe600' }, 2),
  plateF: spr(['...rrrr...', '.rrRRRRrr.', '.rRrrrrRr.', 'rRr....rRr', 'rRr.ww.rRr', 'rRr.ww.rRr', 'rRr....rRr', '.rRrrrrRr.', '.rrRRRRrr.', '...rrrr...'], { r: '#d81e1e', R: '#ff5a4a', w: '#ffffff' }, 2),
  wok: spr(['...........................', 'wwwwwwwwwwwwwwwwwwwww......', '.wdddddddddddddddddw.......', '..wdddddddddddddddw..hhhhhh', '...wdddddddddddddw..hhhhhh.', '.....wwdddddddww...........', '.......wwwwwwww............'], { w: '#ffffff', d: '#3a3a3a', h: '#8b5a2b' }, 2),
  bowl: spr(['..ywyywy..', '.wywwyywy.', 'wwwwwwwwww', '.bbbbbbbb.', '..bbbbbb..', '...bbbb...'], { w: '#fff8e0', y: '#ffd21a', b: '#ffffff' }, 2),
  sweat: spr(['.b.', 'bbb', 'bwb', '.b.'], { b: '#5ac8ff', w: '#ffffff' }, 2),
  bang: spr(['..#..', '..#..', '..#..', '.....', '..#..'], { '#': '#ff2020' }, 3),
  z: spr(['####', '..#.', '.#..', '####'], { '#': '#ffffff' }, 2),
};
const ICON = {
  fight: spr(['.........#', '........##', '.......##.', '......##..', '.#..##....', '..###.....', '..##......', '.#..#.....', '#.........'], { '#': '#ff7f27' }, 2),
  act: spr(['.######.', '#......#', '#.#.#..#', '#......#', '.###.##.', '...#....'], { '#': '#ff7f27' }, 2),
  item: spr(['..####..', '.#....#.', '########', '#......#', '#..##..#', '#......#', '########'], { '#': '#ff7f27' }, 2),
  mercy: spr(['#.....#', '.#...#.', '..#.#..', '...#...', '..#.#..', '.#...#.', '#.....#'], { '#': '#ff7f27' }, 2),
};
function recolor(c, col) { const o = document.createElement('canvas'); o.width = c.width; o.height = c.height; const g = o.getContext('2d'); g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, o.width, o.height); return o; }
for (const k in ICON) ICON[k + 'Y'] = recolor(ICON[k], '#ffff00');

/* ---------- scheduler (game-time promises, abortable) ---------- */
let T = 0; const timers = [], waiters = [];
const ABORT = { abort: true };
const wait = s => new Promise((res, rej) => timers.push({ t: T + s, res, rej }));
const until = fn => new Promise((res, rej) => waiters.push({ fn, res, rej }));
const clearHits = () => { for (const k in hit) hit[k] = false; };
const keyZ = () => { clearHits(); return until(() => took('z')); };
function abortAll() { const a = timers.splice(0), b = waiters.splice(0); a.forEach(x => x.rej(ABORT)); b.forEach(x => x.rej(ABORT)); }
function runTimers() {
  for (let i = timers.length - 1; i >= 0; i--) if (T >= timers[i].t) { const x = timers.splice(i, 1)[0]; x.res(); }
  for (let i = waiters.length - 1; i >= 0; i--) { let ok = false; try { ok = waiters[i].fn(); } catch (e) { ok = true; } if (ok) { const x = waiters.splice(i, 1)[0]; x.res(); } }
}
// animate a value over time: fn(k) with eased k
function tween(d, fn, ez = ezo) { const t0 = T; return new Promise((res, rej) => { const w = { fn: () => { const k = clamp((T - t0) / d, 0, 1); fn(ez(k), k); return k >= 1; }, res, rej }; waiters.push(w); }); }
const swallow = e => { if (e !== ABORT) throw e; };

/* ---------- images ---------- */
function loadImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }

/* ========= 현태: body sprite + photo head (face states) + props + speech bubble ========= */
let BODY = null, HEAD = null;
const BW = 750, BH = 677, BS = 116 / 750;          // body source size and logical scale
const TORSO_CUT = 360;                              // source row where the legs begin
const HEAD_H = 108, HEAD_SC = HEAD_H / 342, HEAD_W = 240 * HEAD_SC;
const EYE_N = { x: 86, y: 152, rx: 27, ry: 12 }, EYE_F = { x: 26, y: 158, rx: 11, ry: 11 };  // in head image px
const SKIN = '#b98670';
const hy = {
  x: 320, feet: 240, dx: 0, dy: 0, lean: 0, headRot: 0, headDx: 0, headDy: 0, sq: 1,
  face: 'normal', sweat: 0, tint: 0, alpha: 1, vis: true, idle: true, prop: null, propT: 0, propY: 0, shake: 0, flash: 0,
  hpShow: 0, hp: 1, zzz: false,
};
const headCv = document.createElement('canvas'); headCv.width = 240; headCv.height = 342; const hg = headCv.getContext('2d');
let headKey = '';
const U = 342 / HEAD_H;   // one logical pixel in head-image px → effects snap to this grid
function pxEllipse(g, e, col, grow = 0) {
  g.fillStyle = col;
  const rx = e.rx + grow * U, ry = e.ry + grow * U;
  for (let y = e.y - ry; y <= e.y + ry; y += U) for (let x = e.x - rx; x <= e.x + rx; x += U) {
    const cx = Math.floor(x / U) * U, cy = Math.floor(y / U) * U;
    const nx = (cx + U / 2 - e.x) / rx, ny = (cy + U / 2 - e.y) / ry;
    if (nx * nx + ny * ny <= 1) g.fillRect(cx, cy, U + 0.5, U + 0.5);
  }
}
function px(g, gx, gy, col) { g.fillStyle = col; g.fillRect(Math.floor(gx / U) * U, Math.floor(gy / U) * U, U + 0.5, U + 0.5); }
function closedEye(g, e) {
  pxEllipse(g, e, SKIN, 0.4);
  for (let x = e.x - e.rx; x <= e.x + e.rx; x += U) { const k = (x - e.x) / e.rx; px(g, x, e.y + 1 + k * k * 5, '#2a1a14'); }

function buildHead() {
