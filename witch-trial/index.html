<title>1인분의 마녀재판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@700;800&display=swap">
<style>
/* one look: a locked-down school after dark — blood-red trial ring, candle lives, dialogue panel below the scene */
:root{
  --ink:#0a0607; --panel:#170c0e; --panel2:#2a1416; --line:#f0dcd6; --gold:#f2c14e; --red:#e8452f; --blue:#4fb3ff; --green:#5fe08a; --text:#fbf8ff; --muted:#a49cb8;
  --f-shout:"Black Han Sans","Nanum Gothic",system-ui,sans-serif;
  --f-text:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-text);margin:0;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-block:6px;box-sizing:border-box}
#stage{position:relative;width:min(100vw,calc((100dvh - 150px) * 16 / 9),1100px);aspect-ratio:16/9;max-width:100%;background:#000;overflow:hidden;border-radius:6px;box-shadow:0 0 0 2px #2b2540,0 10px 40px rgba(0,0,0,.6)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
/* dialogue */
#tb{position:absolute;left:2%;right:2%;bottom:3%;height:30%;background:rgba(18,6,8,.9);border:3px solid var(--line);border-radius:10px;box-shadow:inset 0 0 0 2px #5a1a1c;padding:2.2% 3%;box-sizing:border-box;font-size:clamp(13px,2.15vw,23px);line-height:1.5;font-weight:800;cursor:pointer;letter-spacing:.01em}
#tb[hidden]{display:none!important}
#nm{position:absolute;left:2.5%;top:-1.25em;background:linear-gradient(#b8261c,#6a0e0a);border:3px solid var(--line);border-radius:8px 8px 0 0;padding:.05em .8em .1em;font-size:.8em;font-weight:800;color:#fff;letter-spacing:.06em;white-space:nowrap}
#nm[hidden]{display:none!important}
#tx{white-space:pre-wrap;word-break:keep-all}
#tx .b{color:var(--blue)} #tx .r{color:#ff6a50} #tx .g{color:var(--green)} #tx .y{color:var(--gold)}
#arrow{position:absolute;right:2.2%;bottom:8%;color:var(--gold);font-size:.9em;animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
#arrow[hidden]{display:none!important}
#ceTag{position:absolute;top:2.5%;left:50%;transform:translateX(-50%);max-width:58%;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-shout);color:#fff;font-size:clamp(10px,1.9vw,22px);letter-spacing:.12em;text-shadow:0 0 8px #ff7a3c,0 2px 0 #7a1200;white-space:nowrap}
#ceTag[hidden]{display:none!important}
#hp{position:absolute;top:3%;right:2%;display:flex;gap:4px}
#hp[hidden]{display:none!important}
.egg{width:clamp(12px,1.9vw,20px);aspect-ratio:1/2.2;border-radius:3px;background:radial-gradient(ellipse 34% 18% at 50% 14%,#fff6c0 30%,#ffb02a 60%,#ff5a1a 78%,transparent 82%),linear-gradient(to bottom,transparent 34%,#f4ecd8 34%,#d8ccb0);filter:drop-shadow(0 0 4px rgba(255,140,40,.6))}
.egg.broken{background:linear-gradient(to bottom,transparent 34%,#6a6058 34%,#4a4038);filter:none;opacity:.5}
.egg.hit{animation:crack .5s}
@keyframes crack{0%,100%{transform:none}30%{transform:rotate(-18deg) scale(1.3)}60%{transform:rotate(14deg)}}
/* controls (the lower screen) */
#ctl{width:min(100vw,1100px);max-width:100%;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-inline:max(10px,env(safe-area-inset-left,0px));box-sizing:border-box;min-height:56px}
.btn{font-family:var(--f-shout);font-size:clamp(15px,2.2vw,21px);letter-spacing:.06em;border:3px solid #0a0812;border-radius:12px;padding:.45em 1.1em;color:#1b1206;background:linear-gradient(#ffe08a,#e8a92a);box-shadow:0 4px 0 #6b4410,inset 0 2px 0 rgba(255,255,255,.6);cursor:pointer;min-height:48px;min-width:64px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4410}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.red{background:linear-gradient(#ff7b5c,#d23218);color:#fff;box-shadow:0 4px 0 #6b1306,inset 0 2px 0 rgba(255,255,255,.4)}
.btn.dark{background:linear-gradient(#4a4163,#2b2540);color:#fff;box-shadow:0 4px 0 #120f1c,inset 0 2px 0 rgba(255,255,255,.2)}
.btn.blue{background:linear-gradient(#6fb7ff,#2f6fd0);color:#fff;box-shadow:0 4px 0 #12306b,inset 0 2px 0 rgba(255,255,255,.4)}
.btn[hidden]{display:none!important}
/* choices */
#choices{position:absolute;inset:0 0 34% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2%}
#choices[hidden]{display:none!important}
#choices button{font-family:var(--f-text);font-weight:800;font-size:clamp(14px,2.2vw,22px);width:min(60%,520px);padding:.6em 1em;border:3px solid var(--line);border-radius:10px;background:rgba(20,17,40,.94);color:#fff;cursor:pointer}
#choices button:hover,#choices button:focus-visible{background:#3a2f6a;outline:none;border-color:var(--gold)}
/* court record */
#rec{position:fixed;inset:0;background:rgba(6,5,12,.86);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:20}
#rec[hidden]{display:none!important}
#recBox{width:min(980px,100%);max-height:100%;background:linear-gradient(#2a1416,#140a0b);border:3px solid var(--gold);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #000}
#recHead{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#3a1210;border-bottom:3px solid #0a0812;flex-wrap:wrap}
#recHead h2{margin:0;font-family:var(--f-shout);font-weight:400;font-size:22px;color:var(--gold);letter-spacing:.1em;flex:1;min-width:120px}
.tab{font-family:var(--f-text);font-weight:800;font-size:15px;border:2px solid #0a0812;border-radius:8px;padding:6px 14px;background:#5a4626;color:#fff;cursor:pointer;min-height:40px}
.tab.on{background:var(--gold);color:#1a1206}
#recMain{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;padding:12px;overflow:auto}
@media (max-width:640px){#recMain{grid-template-columns:1fr}}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;align-content:start}
.item{background:#110e1a;border:3px solid #463b62;border-radius:10px;padding:6px 4px 4px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-text);font-weight:800;font-size:13px;min-height:44px}
.item canvas{width:72px;height:72px}
.item.sel{border-color:var(--gold);background:#2d2510}
.item.new::after{content:"NEW";font-size:10px;color:#1a1206;background:var(--gold);border-radius:4px;padding:0 4px}
#detail{background:#0f0c18;border:2px solid #463b62;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
#detail h3{margin:0;font-size:19px;color:var(--gold)}
#detail p{margin:0;font-size:15px;line-height:1.65;color:#e9e4f7;white-space:pre-wrap;word-break:keep-all}
#dcv{width:100%;max-width:420px;aspect-ratio:4/3;background:#000;border-radius:8px;align-self:center}
#recFoot{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:2px solid #0a0812;flex-wrap:wrap}
#recFoot .hint{flex:1;color:var(--muted);font-size:14px;align-self:center;min-width:160px}
/* title / overlays */
#ov{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:flex-end;align-content:flex-end;justify-content:center;padding:0 3% 6%;gap:10px}
#ov[hidden]{display:none!important}
#toast{position:absolute;top:14%;left:50%;transform:translateX(-50%);background:rgba(20,16,34,.95);border:3px solid var(--gold);border-radius:10px;padding:.5em 1em;font-weight:800;font-size:clamp(13px,2vw,19px);display:flex;align-items:center;gap:.6em;white-space:nowrap}
#toast canvas{width:clamp(36px,6vw,64px);height:clamp(36px,6vw,64px)}
#toast[hidden]{display:none!important}
#mute{position:absolute;top:2.5%;left:1.5%;font-size:13px;background:rgba(0,0,0,.5);color:#fff;border:2px solid #fff6;border-radius:8px;padding:4px 8px;cursor:pointer;font-family:var(--f-text);font-weight:800;z-index:2}
@media (prefers-reduced-motion:reduce){#arrow{animation:none}.egg.hit{animation:none}}
</style>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="ceTag" hidden>~ 증인 신문 ~</div>
    <div id="hp" hidden></div>
    <div id="choices" hidden></div>
    <div id="toast" hidden><canvas id="tcv" width="128" height="128"></canvas><span id="ttx"></span></div>
    <div id="tb" hidden><div id="nm" hidden></div><div id="tx"></div><div id="arrow">▼</div></div>
    <div id="ov" hidden></div>
    <button id="mute" type="button">소리 ON</button>
  </div>
  <div id="ctl"></div>
</div>
<div id="rec" hidden>
  <div id="recBox" role="dialog" aria-label="조사 수첩">
    <div id="recHead"><h2 id="recTitle">조사 수첩</h2><button class="tab on" id="tabEv" type="button">증거품</button><button class="tab" id="tabPr" type="button">인물</button></div>
    <div id="recMain"><div id="grid"></div><div id="detail"><canvas id="dcv" width="480" height="360"></canvas><h3 id="dName"></h3><p id="dDesc"></p></div></div>
    <div id="recFoot"><span class="hint" id="recHint"></span><button class="btn dark" id="dMore" type="button">자세히 보기</button><button class="btn red" id="dPresent" type="button">이걸 들이민다!</button><button class="btn dark" id="recClose" type="button">닫기</button></div>
  </div>
</div>

<script>
'use strict';
/* ========= 역전현태 · 시우 공방 — core: canvas, clock, audio, input ========= */
const W = 960, H = 540, PI = Math.PI, TAU = PI * 2;
const $ = s => document.querySelector(s);
const cv = $('#cv'); let ctx = cv.getContext('2d');
const TEST = location.hash.includes('test');
let SPEED = 1, T = 0, RT = 0, last = performance.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, rnd = (a, b) => a + Math.random() * (b - a);
const ezo = k => 1 - Math.pow(1 - k, 3), ezio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function fitCanvas() {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const s = Math.min(2.5, Math.max(1, (window.devicePixelRatio || 1) * r.width / W));
  const w = Math.round(W * s), h = Math.round(H * s); if (cv.width !== w) { cv.width = w; cv.height = h; }
}
addEventListener('resize', fitCanvas);
// ---- game clock: every wait runs on game time so tests can fast-forward ----
const timers = [];
const wait = s => new Promise(r => timers.push({ at: T + s, r }));
const until = f => new Promise(r => timers.push({ f, r }));
function tick(dt) { for (let i = timers.length - 1; i >= 0; i--) { const t = timers[i]; if (t.f ? t.f() : T >= t.at) { timers.splice(i, 1); t.r(); } } }
async function tween(d, f, ez = ezio) { const t0 = T; while (T - t0 < d) { f(ez(clamp((T - t0) / d, 0, 1))); await wait(0); } f(1); }
// ---- images ----
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
const IMG = {};
// ---- audio: a tiny chiptune synth ----
const audio = (() => {
  let ac = null, master = null, mus = null, musGain = null, muted = false, cur = null, seqT = 0, seqStep = 0, seqTimer = 0;
  function init() { if (ac) return; try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination); musGain = ac.createGain(); musGain.gain.value = 0.32; musGain.connect(master); } catch (e) { ac = null; } }
  function tone(f, d, v = 0.15, type = 'square', when = 0, slide = 0, dest) {
    if (!ac || muted || TEST) return; const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + 0.02);
  }
  function noise(d, v = 0.2, freq = 1200, when = 0, q = 0.8, sweep = 0) {
    if (!ac || muted || TEST) return; const t = ac.currentTime + when, n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); if (sweep) f.frequency.exponentialRampToValueAtTime(freq * sweep, t + d); f.Q.value = q; g.gain.value = v;
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  // ---- music: note strings "A4:2 r:1 C5:1" — durations in 8ths ----
  const NOTE = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
  const hz = n => { const m = n.match(/^([A-G])(#|b)?(\d)$/); if (!m) return 0; const s = NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] - 4) * 12; return 440 * Math.pow(2, s / 12); };
  function parse(str) { const out = []; let t = 0; for (const tok of str.trim().split(/\s+/)) { const [n, d] = tok.split(':'); const dd = +(d || 1); out.push({ t, f: n === 'r' ? 0 : hz(n), d: dd }); t += dd; } return { notes: out, len: t }; }
  const SONGS = {};
  function song(name, bpm, parts) { SONGS[name] = { bpm, parts: parts.map(p => Object.assign(parse(p.n), p)) }; }
  // all tunes below are original
  song('lobby', 96, [
    { n: 'E4:2 G4:2 A4:2 G4:1 E4:1 D4:2 C4:2 D4:2 E4:2 | G4:2 C5:2 B4:2 A4:1 G4:1 E4:4 r:4'.replace(/\|/g, ''), w: 'triangle', v: 0.18 },
    { n: 'C3:4 G3:4 A2:4 E3:4 F2:4 C3:4 G2:4 G2:4', w: 'triangle', v: 0.16 },
    { n: 'r:2 E5:1 r:5 r:2 C5:1 r:5 r:2 A4:1 r:5 r:2 B4:1 r:5', w: 'square', v: 0.035 }]);
  song('trial', 112, [
    { n: 'A4:2 A4:1 C5:1 E5:3 D5:1 C5:2 B4:2 G4:4 A4:2 C5:2 E5:2 A5:2 G5:3 E5:1 D5:2 E5:6', w: 'square', v: 0.07 },
    { n: 'A2:2 A3:2 A2:2 A3:2 F2:2 F3:2 G2:2 G3:2 A2:2 A3:2 F2:2 F3:2 G2:2 G3:2 E2:2 E3:2', w: 'triangle', v: 0.2 },
    { n: 'r:1 E4:1 r:1 E4:1 r:1 C4:1 r:1 C4:1 r:1 D4:1 r:1 D4:1 r:1 B3:1 r:1 B3:1', w: 'square', v: 0.03 }]);
  song('cross', 124, [
    { n: 'A2:1 A2:1 A3:1 A2:1 G2:1 G2:1 G3:1 G2:1 F2:1 F2:1 F3:1 F2:1 E2:1 E2:1 G#2:1 B2:1', w: 'triangle', v: 0.22 },
    { n: 'r:4 E5:1 D5:1 C5:1 B4:1 r:4 C5:1 B4:1 A4:1 G#4:1 r:4 A4:1 B4:1 C5:1 D5:1 E5:3 r:1 B4:4', w: 'square', v: 0.06 },
    { n: 'C4:1 r:1 C4:1 r:1 B3:1 r:1 B3:1 r:1 A3:1 r:1 A3:1 r:1 G#3:1 r:1 G#3:1 r:1', w: 'square', v: 0.025 }]);
  song('pursuit', 158, [
    { n: 'D3:1 D3:1 D4:1 D3:1 D3:1 D4:1 D3:1 C4:1 Bb2:1 Bb2:1 Bb3:1 Bb2:1 C3:1 C3:1 C4:1 E3:1', w: 'triangle', v: 0.24 },
    { n: 'A4:2 D5:2 F5:2 E5:1 D5:1 C5:2 D5:2 A4:4 Bb4:2 D5:2 G5:2 F5:1 E5:1 F5:2 E5:2 C5:4', w: 'square', v: 0.075 },
    { n: 'F4:1 A4:1 F4:1 A4:1 F4:1 A4:1 F4:1 A4:1 F4:1 Bb4:1 F4:1 Bb4:1 G4:1 C5:1 G4:1 C5:1', w: 'square', v: 0.025 }]);
  song('win', 132, [
    { n: 'C5:1 E5:1 G5:1 C6:3 r:1 A5:1 G5:2 E5:2 F5:2 A5:2 G5:4 E5:1 G5:1 C6:6', w: 'square', v: 0.08 },
    { n: 'C3:2 G3:2 C3:2 G3:2 F2:2 C3:2 G2:2 D3:2 C3:2 G3:2 F2:2 G2:2 C3:4 C3:4', w: 'triangle', v: 0.2 }]);
  song('sad', 72, [
    { n: 'E4:3 D4:1 C4:2 B3:2 A3:4 r:2 C4:2 B3:3 A3:1 G#3:2 B3:2 A3:6 r:2', w: 'triangle', v: 0.18 },
    { n: 'A2:4 E3:4 F2:4 C3:4 D3:4 A2:4 E2:4 E2:4', w: 'triangle', v: 0.12 }]);
  song('tension', 80, [
    { n: 'A2:8 Bb2:8 A2:8 G#2:8', w: 'triangle', v: 0.16 },
    { n: 'r:6 E5:1 r:1 r:8 r:6 F5:1 r:1 r:8', w: 'square', v: 0.025 }]);
  song('dark', 70, [
    { n: 'D2:8 Eb2:8 D2:8 C#2:8', w: 'triangle', v: 0.18 },
    { n: 'r:4 A4:1 r:3 r:2 Bb4:1 r:5 r:4 A4:1 r:1 G#4:1 r:1 r:8', w: 'square', v: 0.03 },
    { n: 'r:7 D6:1 r:8 r:6 Eb6:1 r:9 r:8', w: 'sine', v: 0.04 }]);
  song('debate', 138, [
    { n: 'E2:1 E3:1 E2:1 E3:1 F2:1 F3:1 F2:1 F3:1 E2:1 E3:1 E2:1 E3:1 D2:1 D3:1 D#2:1 D#3:1', w: 'triangle', v: 0.22 },
    { n: 'B4:2 C5:1 B4:1 A4:2 G#4:2 B4:2 E5:2 D#5:4 B4:2 C5:1 D5:1 E5:2 F5:2 E5:3 D#5:1 B4:4', w: 'square', v: 0.065 },
    { n: 'r:1 G#3:1 r:1 G#3:1 r:1 A3:1 r:1 A3:1 r:1 G#3:1 r:1 G#3:1 r:1 F#3:1 r:1 F#3:1', w: 'square', v: 0.025 }]);
  song('exec', 96, [
    { n: 'A2:2 E3:1 E3:1 G#2:2 E3:1 E3:1 G2:2 E3:1 E3:1 F#2:2 D#3:1 D#3:1', w: 'triangle', v: 0.2 },
    { n: 'A4:3 C5:1 E5:2 D#5:3 F5:1 E5:2 C5:3 B4:1 A4:2 G#4:6', w: 'square', v: 0.06 }]);
  function sched() {
    if (!ac || !cur) return; const S = SONGS[cur], st = 60 / S.bpm / 2;
    while (seqT < ac.currentTime + 0.25) {
      for (const p of S.parts) { const k = seqStep % p.len; for (const n of p.notes) if (n.t === k && n.f) tone(n.f, n.d * st * 0.92, p.v, p.w, seqT - ac.currentTime, 0, musGain); }
      seqT += st; seqStep++;
    }
  }
  return {
    init, tone, noise, get muted() { return muted; },
    toggle() { muted = !muted; if (musGain) musGain.gain.value = muted ? 0 : 0.32; return muted; },
    music(name) { init(); if (cur === name) return; cur = name || null; if (!ac) return; seqT = ac.currentTime + 0.05; seqStep = 0; clearInterval(seqTimer); if (cur) seqTimer = setInterval(sched, 60); },
    get song() { return cur; },
    blip(f) { tone(f, 0.035, 0.05, 'square'); },
    gavel() { tone(140, 0.12, 0.4, 'triangle', 0, 0.5); noise(0.08, 0.5, 900); },
    slam() { noise(0.2, 0.7, 300, 0, 0.6); tone(70, 0.25, 0.4, 'sine', 0, 0.5); },
    shout() { noise(0.25, 0.4, 2500, 0, 0.5, 0.4); tone(392, 0.12, 0.12, 'sawtooth'); tone(523, 0.12, 0.12, 'sawtooth', 0.06); tone(784, 0.5, 0.14, 'sawtooth', 0.12, 0.98); },
